<section id="avaliacoes"><div class="wrap"><div class="eyebrow" data-pt="Avaliações" data-en="Reviews"></div><h2 data-pt="O que dizem os clientes" data-en="What guests say"></h2><div class="rv2 rv"><button class="ar" id="rp" aria-label="Anterior">‹</button><div class="vp"><div class="rt" id="rt"><figure class="rc w"><div class="rh"><span>Google Review</span><span class="stars">★★★★★</span></div><p>Foi incrível, o espaço está lindo, a comida estava muito boa desde o sushi aos pratos quentes e a carne. A sobremesa foi soberba. Os empregados foram muito atenciosos e simpáticos. Para repetir.</p><figcaption>Andreia Lourenco</figcaption></figure><figure class="rc w"><div class="rh"><span>Google Review</span><span class="stars">★★★★★</span></div><p>Uma experiência excelente! O rodízio vale muito a pena, com peixe extremamente fresco e sushi de altíssima qualidade. O grande diferencial são os pratos quentes e salteados (como a lula e o polvo), super bem temperados. Atendimento simpático e ambiente agradável. Com certeza vou voltar!</p><figcaption>Mendes Joao</figcaption></figure><figure class="rc"><div class="rh"><span>Google Review</span><span class="stars">★★★★★</span></div><p>Experiência muito boa. Comida de elevada qualidade, com excelente apresentação. Funcionários rápidos e muito educados no serviço.</p><figcaption>Andre Guimaraes</figcaption></figure><figure class="rc"><div class="rh"><span>Google Review</span><span class="stars">★★★★★</span></div><p>O melhor rodízio de sushi que já fui.</p><figcaption>Bruno Santos</figcaption></figure><figure class="rc"><div class="rh"><span>Google Review</span><span class="stars">★★★★★</span></div><p>Restaurante incrível! Comida super fresca, atendimento muito bom, rápido e eficaz. Colaboradores super simpáticos, recomendo. Ainda nos ofereceram rebuçados.</p><figcaption>Beatriz Pratas</figcaption></figure><figure class="rc"><div class="rh"><span>Google Review</span><span class="stars">★★★★★</span></div><p>Já há muito tempo que não encontrava um sushi, gyozas e sopa miso com esta qualidade. Sem dúvida uma experiência para repetir. Atendimento 5 estrelas.</p><figcaption>Ana Carolina</figcaption></figure><figure class="rc"><div class="rh"><span>Google Review</span><span class="stars">★★★★★</span></div><p>Adorei este restaurante! A decoração é moderna e elegante, o sushi é excelente e o atendimento é muito simpático. Com certeza voltarei!</p><figcaption>ALEX</figcaption></figure></div></div><button class="ar" id="rn" aria-label="Seguinte">›</button></div></div></section>
